<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de invitados · Incorporación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at center, #1d4059, #102a42 68%, #0b2034);
      color: #102a42;
      font-family: 'Montserrat', Arial, sans-serif;
    }
    main {
      width: min(100%, 600px);
      max-height: calc(100svh - 56px);
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: clamp(20px, 5vw, 32px);
      overflow: hidden;
      border: 1px solid #c5a064;
      border-radius: 12px;
      background: #f9f5ee;
      box-shadow: 0 20px 45px #030e1866;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: #9e7a3e;
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font: 400 clamp(25px, 6vw, 36px) 'Cinzel', Georgia, serif;
    }
    .summary { margin: 10px 0 18px; font-size: 13px; line-height: 1.5; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
    button {
      border: 1px solid #c5a064;
      border-radius: 999px;
      padding: 9px 16px;
      background: #102a42;
      color: #fff4d4;
      font: 600 11px 'Montserrat', Arial, sans-serif;
      cursor: pointer;
    }
    a { color: #102a42; font-size: 12px; text-underline-offset: 3px; }
    #status { margin: 0 0 8px; font-size: 12px; min-height: 18px; }
    ol {
      min-height: 80px;
      flex: 1 1 auto;
      margin: 0;
      padding: 8px 8px 8px 34px;
      overflow-y: auto;
      border-top: 1px solid #d4c29e;
      line-height: 2;
      font-size: 14px;
    }
    li { padding-left: 5px; border-bottom: 1px solid #e7ddca; }
    .site-credit {
      position: fixed;
      left: 50%;
      bottom: max(6px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      color: #c9b895;
      font: 500 13px 'Montserrat', Arial, sans-serif;
      letter-spacing: .08em;
      white-space: nowrap;
    }
    .site-credit a { color: #f0d9a8; font-weight: 600; text-decoration: none; border-bottom: 1px solid rgba(240, 217, 168, .55); }
    .site-credit a:hover, .site-credit a:focus-visible { color: #fff; border-bottom-color: #fff; }
    @media (max-width: 480px) {
      body { padding-right: 12px; padding-left: 12px; }
      main { max-height: calc(100svh - 40px); border-radius: 14px; }
      .toolbar { gap: 8px 12px; }
      button { min-height: 44px; }
      .toolbar a { min-height: 40px; display: inline-flex; align-items: center; }
      ol { min-height: 28svh; }
    }
    @media (max-height: 520px) and (orientation: landscape) {
      body { place-items: start center; padding-top: 12px; padding-bottom: 12px; }
      main { max-height: calc(100svh - 24px); padding: 18px 22px; }
      .summary { margin: 6px 0 10px; }
      ol { min-height: 55px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">✦ Incorporación ✦</p>
    <h1>Lista de invitados</h1>
    <p class="summary">Personas que confirmaron su asistencia.</p>
    <div class="toolbar">
      <button id="refresh" type="button">Actualizar lista</button>
      <a href="index.html">Volver a la invitación</a>
    </div>
    <p id="status" role="status" aria-live="polite">Cargando…</p>
    <ol id="guests"></ol>
  </main>
  <div class="site-credit">Built by <a href="https://qodev-ec.com/" target="_blank" rel="noopener noreferrer">Qodev</a></div>
  <script src="config.js"></script>
  <script src="rsvp-data.js"></script>
  <script>
    const list = document.getElementById('guests');
    const status = document.getElementById('status');
    async function loadGuests() {
      status.textContent = 'Cargando…';
      list.replaceChildren();
      try {
        const guests = await window.rsvpData.listGuests();
        for (const name of guests) {
          const item = document.createElement('li');
          item.textContent = name;
          list.append(item);
        }
        status.textContent = guests.length
          ? `${guests.length} ${guests.length === 1 ? 'persona confirmada' : 'personas confirmadas'}`
          : 'Aún no hay confirmaciones.';
      } catch (error) {
        status.textContent = error.message || 'No se pudo cargar la lista.';
      }
    }
    document.getElementById('refresh').addEventListener('click', loadGuests);
    loadGuests();
  </script>
</body>
</html>

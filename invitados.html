<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de invitados · Incorporación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at center, #1d4059, #102a42 68%, #0b2034);
      color: #102a42;
      font-family: 'Montserrat', Arial, sans-serif;
    }
    main {
      width: min(100%, 520px);
      max-height: calc(100svh - 56px);
      display: flex;
      flex-direction: column;
      padding: 28px;
      border: 1px solid #c5a064;
      border-radius: 12px;
      background: #f9f5ee;
      box-shadow: 0 20px 45px #030e1866;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: #9e7a3e;
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font: 400 clamp(25px, 6vw, 36px) 'Cinzel', Georgia, serif;
    }
    .summary { margin: 10px 0 18px; font-size: 13px; line-height: 1.5; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
    button {
      border: 1px solid #c5a064;
      border-radius: 999px;
      padding: 9px 16px;
      background: #102a42;
      color: #fff4d4;
      font: 600 11px 'Montserrat', Arial, sans-serif;
      cursor: pointer;
    }
    a { color: #102a42; font-size: 12px; text-underline-offset: 3px; }
    #status { margin: 0 0 8px; font-size: 12px; min-height: 18px; }
    ol {
      min-height: 80px;
      margin: 0;
      padding: 8px 8px 8px 34px;
      overflow-y: auto;
      border-top: 1px solid #d4c29e;
      line-height: 2;
      font-size: 14px;
    }
    li { padding-left: 5px; border-bottom: 1px solid #e7ddca; }
    .site-credit {
      position: fixed;
      left: 50%;
      bottom: 6px;
      transform: translateX(-50%);
      color: #c9b895;
      font: 500 10px 'Montserrat', Arial, sans-serif;
      letter-spacing: .08em;
      white-space: nowrap;
    }
    .site-credit a { color: #f0d9a8; font-weight: 600; text-decoration: none; border-bottom: 1px solid rgba(240, 217, 168, .55); }
    .site-credit a:hover, .site-credit a:focus-visible { color: #fff; border-bottom-color: #fff; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">✦ Incorporación ✦</p>
    <h1>Lista de invitados</h1>
    <p class="summary">Personas que confirmaron su asistencia.</p>
    <div class="toolbar">
      <button id="refresh" type="button">Actualizar lista</button>
      <a href="index.html">Volver a la invitación</a>
      <a id="download" href="#">Descargar TXT</a>
    </div>
    <p id="status" role="status" aria-live="polite">Cargando…</p>
    <ol id="guests"></ol>
  </main>
  <div class="site-credit">Built by <a href="https://qodev-ec.com/" target="_blank" rel="noopener noreferrer">Qodev</a></div>
  <script src="config.js"></script>
  <script src="rsvp-data.js"></script>
  <script>
    const list = document.getElementById('guests');
    const status = document.getElementById('status');
    let currentGuests = [];
    async function loadGuests() {
      status.textContent = 'Cargando…';
      list.replaceChildren();
      try {
        currentGuests = await window.rsvpData.listGuests();
        for (const name of currentGuests) {
          const item = document.createElement('li');
          item.textContent = name;
          list.append(item);
        }
        status.textContent = currentGuests.length
          ? `${currentGuests.length} ${currentGuests.length === 1 ? 'persona confirmada' : 'personas confirmadas'}`
          : 'Aún no hay confirmaciones.';
      } catch (error) {
        status.textContent = error.message || 'No se pudo cargar la lista.';
      }
    }
    document.getElementById('refresh').addEventListener('click', loadGuests);
    document.getElementById('download').addEventListener('click', event => {
      event.preventDefault();
      const file = new Blob([currentGuests.join('\n') + (currentGuests.length ? '\n' : '')], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(file);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'invitados.txt';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    loadGuests();
  </script>
</body>
</html>
